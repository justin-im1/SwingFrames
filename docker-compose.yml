services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: swingframes
      POSTGRES_PASSWORD: swingframes
      POSTGRES_DB: swingframes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swingframes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
